name: Update veDOLO Data

on:
  schedule:
    - cron: '17 */6 * * *'  # Every 6 hours, staggered
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore locked DOLO cache
        uses: actions/cache@v5
        with:
          path: locked_cache.json
          key: locked-cache-v6-${{ github.run_id }}
          restore-keys: |
            locked-cache-v6-

      - name: Restore veDOLO vote power history state
        uses: actions/cache@v5
        with:
          path: vedolo_vote_power_history_state.json
          key: vedolo-vote-power-history-v1-${{ github.run_id }}
          restore-keys: |
            vedolo-vote-power-history-v1-

      - name: Run update script
        run: python update_data.py
        env:
          PYTHONUNBUFFERED: '1'
          BERASCAN_API_KEY: ${{ secrets.BERASCAN_API_KEY }}
          ALCHEMY_BERACHAIN_RPC: ${{ secrets.ALCHEMY_BERACHAIN_RPC }}
          ALCHEMY_BERACHAIN_RPC_2: ${{ secrets.ALCHEMY_BERACHAIN_RPC_2 }}
          ALCHEMY_BERACHAIN_RPC_3: ${{ secrets.ALCHEMY_BERACHAIN_RPC_3 }}
          VEDOLO_MAX_RUNTIME_SECONDS: '1080'
          VEDOLO_RPC_TIMEOUT_SECONDS: '8'
          VEDOLO_RPC_RETRIES: '2'
          VEDOLO_LOCKED_STALE_REFRESH_LIMIT: '100'
          VEDOLO_LOCKED_FAILED_RETRY_LIMIT: '20'
          VEDOLO_LOCKED_ZERO_RETRY_LIMIT: '20'
          VEDOLO_VOTE_STALE_REFRESH_LIMIT: '100'
          VEDOLO_VOTE_FAILED_RETRY_LIMIT: '20'
          VEDOLO_VOTE_ZERO_RETRY_LIMIT: '20'

      - name: Generate canonical veDOLO vote power history
        run: python3 generate_vedolo_vote_power_history.py
        env:
          PYTHONUNBUFFERED: '1'
          ALCHEMY_BERACHAIN_RPC: ${{ secrets.ALCHEMY_BERACHAIN_RPC }}
          ALCHEMY_BERACHAIN_RPC_2: ${{ secrets.ALCHEMY_BERACHAIN_RPC_2 }}
          ALCHEMY_BERACHAIN_RPC_3: ${{ secrets.ALCHEMY_BERACHAIN_RPC_3 }}

      # TVL/DeFiLlama/Revenue are owned by update-tvl-data.yml (hourly)

      - name: Fetch oDOLO contract data
        run: python3 fetch_odolo_contract.py

      - name: Validate generated data
        run: python3 validate_data.py vedolo_holders.json vedolo_stats.json vedolo_expiry.json data/vedolo-vote-power-history.json dolo_price.json odolo_contract_data.json metrics_snapshot.json

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # dolo_price.json is owned by update-dolo-price.yml (hourly). Do not commit it
          # here: with `pull --rebase -X theirs`, a long update-data run could otherwise
          # revert a fresher hourly price back to the stale value captured at job start.
          # update_data.py still regenerates it, so DISCARD that change first — otherwise
          # the unstaged file makes `git pull --rebase` below abort (dirty work tree).
          git checkout -- dolo_price.json 2>/dev/null || true
          git add vedolo_holders.json vedolo_holders.csv vedolo_stats.json vedolo_expiry.json data/vedolo-vote-power-history.json odolo_contract_data.json metrics_snapshot.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "📊 Auto-update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Retry push with rebase up to 3 times to handle concurrent pushes
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin master && git push; then pushed=true; break; fi
            echo "⚠️ Push attempt $i failed, retrying..."
            sleep 5
          done
          if [ "$pushed" != "true" ]; then echo "::error::Push failed after 3 attempts — data NOT published"; exit 1; fi
