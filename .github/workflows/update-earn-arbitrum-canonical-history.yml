name: Refresh Arbitrum Canonical EARN History

on:
  schedule:
    - cron: '18,48 * * * *'  # Every 30 minutes; keeps Arbitrum EARN history within the ~1h freshness target
  workflow_dispatch:
    inputs:
      hot_limit:
        description: 'Maximum published Arbitrum wallets to refresh; 0 refreshes all published histories.'
        required: false
        default: '0'
      checkpoint_steps:
        description: 'Polling steps before checkpointing this run.'
        required: false
        default: '24'

concurrency:
  group: earn-arbitrum-canonical-history
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONUNBUFFERED: '1'
      CHAIN: arbitrum
      BOOTSTRAP_HOT_LIMIT: '120'
      STEADY_HOT_LIMIT: ${{ github.event.inputs.hot_limit || '0' }}
      CHECKPOINT_STEPS: ${{ github.event.inputs.checkpoint_steps || '24' }}
      CHECKPOINT_SLEEP_SECONDS: '20'
      COMMAND_TIMEOUT_SECONDS: '180'
      MAX_RESUME_TARGET_LAG_BLOCKS: '28800'
      ALCHEMY_ARBITRUM_RPC: ${{ secrets.ALCHEMY_ARBITRUM_RPC || secrets.ARBITRUM_RPC_URL || secrets.ARBITRUM_RPC || secrets.ARB_RPC_URL || secrets.ARB_RPC }}
      ALCHEMY_ARBITRUM_RPC_KAT: ${{ secrets.ALCHEMY_ARBITRUM_RPC_KAT }}
      ALCHEMY_ARBITRUM_RPC_DAN: ${{ secrets.ALCHEMY_ARBITRUM_RPC_DAN }}
      ALCHEMY_ARBITRUM_RPC_ZEN: ${{ secrets.ALCHEMY_ARBITRUM_RPC_ZEN }}
      ALCHEMY_ARBITRUM_RPC_2: ${{ secrets.ALCHEMY_ARBITRUM_RPC_2 || secrets.ARBITRUM_RPC_URL_2 || secrets.ARBITRUM_RPC_2 || secrets.ARB_RPC_URL_2 || secrets.ARB_RPC_2 }}
      ALCHEMY_ARBITRUM_RPC_3: ${{ secrets.ALCHEMY_ARBITRUM_RPC_3 || secrets.ARBITRUM_RPC_URL_3 || secrets.ARBITRUM_RPC_3 || secrets.ARB_RPC_URL_3 || secrets.ARB_RPC_3 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Select Arbitrum canonical head wallets
        run: |
          set -euo pipefail
          read -r has_public_baseline hot_limit <<< "$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          try:
              manifest = json.loads(Path("data/earn-subaccount-history/manifest.json").read_text())
          except Exception:
              manifest = {}
          chain = (manifest.get("chains") or {}).get("arbitrum") or {}
          try:
              has_public_baseline = int(chain.get("lastBlock") or 0) > 0
          except Exception:
              has_public_baseline = False
          hot_limit = os.environ["STEADY_HOT_LIMIT"] if has_public_baseline else os.environ["BOOTSTRAP_HOT_LIMIT"]
          print("true" if has_public_baseline else "false", hot_limit)
          PY
          )"
          selector_args=(
            python3 select_earn_canonical_hot_addresses.py
            --chain "$CHAIN"
            --limit "$hot_limit"
            --priority-address-file config/earn_canonical_priority_addresses.txt
            --priority-address-file config/earn_arbitrum_canonical_hot_addresses.txt
            --include-priority-even-if-unknown
            --prefer-stale-history
            --output "/tmp/earn-${CHAIN}-canonical-hot-addresses.txt"
            --metadata-output "/tmp/earn-${CHAIN}-canonical-hot-addresses.json"
          )
          if [ "$has_public_baseline" = "true" ]; then
            selector_args+=(--existing-history-only)
          fi
          "${selector_args[@]}"
          cat "/tmp/earn-${CHAIN}-canonical-hot-addresses.json"

      - name: Restore Arbitrum canonical runtime cache
        uses: actions/cache@v5
        with:
          path: |
            data/earn-subaccount-history-events
            data/earn-subaccount-history/.progress
            data/earn-subaccount-history/.repair-plans
            data/earn-subaccount-history/.incremental-plans
            data/earn-subaccount-history/arbitrum
          key: earn-canonical-runtime-arbitrum-${{ github.run_id }}
          restore-keys: |
            earn-canonical-runtime-arbitrum-

      - name: Refresh Arbitrum canonical history
        id: refresh
        run: |
          set -euo pipefail
          status_path="/tmp/earn-${CHAIN}-canonical-refresh.json"
          python3 run_earn_canonical_history_refresh.py \
            --chain "$CHAIN" \
            --selection-address-file "/tmp/earn-${CHAIN}-canonical-hot-addresses.txt" \
            --max-scan-workers 12 \
            --max-materialize-workers 12 \
            --max-incremental-scan-workers 12 \
            --max-incremental-apply-workers 12 \
            --max-new-backfill-workers 6 \
            --max-steps "$CHECKPOINT_STEPS" \
            --sleep-seconds "$CHECKPOINT_SLEEP_SECONDS" \
            --command-timeout-seconds "$COMMAND_TIMEOUT_SECONDS" \
            --max-resume-target-lag-blocks "$MAX_RESUME_TARGET_LAG_BLOCKS" \
            --allow-checkpoint-incomplete \
            --status-output "$status_path"
          cat "$status_path"
          complete="$(python3 - "$status_path" <<'PY'
          import json
          import sys
          payload = json.load(open(sys.argv[1]))
          print("true" if payload.get("complete") else "false")
          PY
          )"
          skipped="$(python3 - "$status_path" <<'PY'
          import json
          import sys
          payload = json.load(open(sys.argv[1]))
          print("true" if payload.get("skipped") else "false")
          PY
          )"
          echo "complete=${complete}" >> "$GITHUB_OUTPUT"
          echo "skipped=${skipped}" >> "$GITHUB_OUTPUT"
          if [ "$complete" != "true" ]; then
            echo "Canonical history checkpoint saved; later scheduled runs will continue from cache."
          fi

      - name: Build Arbitrum verified ledger cache
        if: steps.refresh.outputs.complete == 'true' && steps.refresh.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          python3 build_earn_verified_ledger.py \
            --chain "$CHAIN" \
            --address-file "/tmp/earn-${CHAIN}-canonical-hot-addresses.txt"
        env:
          PYTHONUNBUFFERED: '1'

      - name: Publish Arbitrum verified ledger shards
        if: steps.refresh.outputs.complete == 'true' && steps.refresh.outputs.skipped != 'true'
        run: |
          python3 build_earn_verified_ledger_shards.py \
            --chain "$CHAIN" \
            --address-file "/tmp/earn-${CHAIN}-canonical-hot-addresses.txt"

      - name: Save Arbitrum canonical runtime cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            data/earn-subaccount-history-events
            data/earn-subaccount-history/.progress
            data/earn-subaccount-history/.repair-plans
            data/earn-subaccount-history/.incremental-plans
            data/earn-subaccount-history/arbitrum
          key: earn-canonical-runtime-arbitrum-${{ github.run_id }}

      - name: Run EARN audit checks
        if: steps.refresh.outputs.complete == 'true' && steps.refresh.outputs.skipped != 'true'
        run: python3 run_earn_audit_checks.py

      - name: Commit and push refreshed canonical history
        if: steps.refresh.outputs.complete == 'true' && steps.refresh.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EARN_DISPATCH_PAGES_AFTER_PUSH: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/earn-subaccount-history/manifest.json
          git add -f data/earn-verified-ledger/manifest.json
          while IFS= read -r address; do
            [ -n "$address" ] || continue
            history_path="data/earn-subaccount-history/${CHAIN}/${address}.json"
            ledger_path="data/earn-verified-ledger/${CHAIN}/${address}.json"
            [ -f "$history_path" ] && git add -f "$history_path"
            [ -f "$ledger_path" ] && git add -f "$ledger_path"
          done < "/tmp/earn-${CHAIN}-canonical-hot-addresses.txt"
          git add -f data/earn-verified-ledger-shards
          bash scripts/commit_with_fresh_earn_status.sh "Refresh Arbitrum canonical EARN history - $(date -u '+%Y-%m-%d %H:%M UTC')"
