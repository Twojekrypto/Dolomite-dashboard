name: Update Operating Income

on:
  schedule:
    - cron: '47 0 * * *'
    - cron: '47 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-operating-income
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout income sources only
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /requirements.txt
            /rpc_client.py
            /rpc_usage.py
            /scan_earn_netflow.py
            /fetch_operating_income.py
            /operating_income_treasury.py
            /operating_income_liquidations.py
            /config/operating_income.json
            /tests/test_operating_income.py
            /tests/test_operating_income_treasury.py
            /tests/test_operating_income_liquidations.py
            /data/operating-income/latest.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify collector arithmetic and completeness guards
        run: python3 -m unittest discover -s tests -p 'test_operating_income*.py'

      - name: Restore immutable treasury receipts and boundary state
        uses: actions/cache@v4
        with:
          path: data/operating-income-cache
          key: operating-income-v1-${{ github.run_id }}
          restore-keys: operating-income-v1-

      - name: Refresh verified operating income
        run: python3 fetch_operating_income.py
        env:
          ALCHEMY_ARBITRUM_RPC: ${{ secrets.ALCHEMY_ARBITRUM_RPC }}
          ALCHEMY_ARBITRUM_RPC_KAT: ${{ secrets.ALCHEMY_ARBITRUM_RPC_KAT }}
          ALCHEMY_ARBITRUM_RPC_DAN: ${{ secrets.ALCHEMY_ARBITRUM_RPC_DAN }}
          ALCHEMY_ARBITRUM_RPC_2: ${{ secrets.ALCHEMY_ARBITRUM_RPC_2 }}
          ALCHEMY_ARBITRUM_RPC_ZEN: ${{ secrets.ALCHEMY_ARBITRUM_RPC_ZEN }}
          ALCHEMY_ARBITRUM_RPC_3: ${{ secrets.ALCHEMY_ARBITRUM_RPC_3 }}
          ALCHEMY_BERACHAIN_RPC: ${{ secrets.ALCHEMY_BERACHAIN_RPC }}
          QUICKNODE_BERACHAIN_RPC_2: ${{ secrets.QUICKNODE_BERACHAIN_RPC_2 }}
          DRPC_BERACHAIN_RPC_ZEN: ${{ secrets.DRPC_BERACHAIN_RPC_ZEN }}
          ALCHEMY_BERACHAIN_RPC_2: ${{ secrets.ALCHEMY_BERACHAIN_RPC_2 }}
          ALCHEMY_BERACHAIN_RPC_2_JEFF: ${{ secrets.ALCHEMY_BERACHAIN_RPC_2_JEFF }}
          ALCHEMY_BERACHAIN_RPC_3: ${{ secrets.ALCHEMY_BERACHAIN_RPC_3 }}
          ALCHEMY_ETHEREUM_RPC: ${{ secrets.ALCHEMY_ETHEREUM_RPC }}
          DRPC_ETHEREUM_RPC_2_JEFF: ${{ secrets.DRPC_ETHEREUM_RPC_2_JEFF }}
          ALCHEMY_ETHEREUM_RPC_KAT: ${{ secrets.ALCHEMY_ETHEREUM_RPC_KAT }}
          ALCHEMY_ETHEREUM_RPC_DAN: ${{ secrets.ALCHEMY_ETHEREUM_RPC_DAN }}
          ALCHEMY_ETHEREUM_RPC_ZEN: ${{ secrets.ALCHEMY_ETHEREUM_RPC_ZEN }}
          ALCHEMY_ETHEREUM_RPC_2: ${{ secrets.ALCHEMY_ETHEREUM_RPC_2 }}
          ALCHEMY_ETHEREUM_RPC_3: ${{ secrets.ALCHEMY_ETHEREUM_RPC_3 }}

      - name: Commit verified data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/operating-income/latest.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Refresh verified operating income: $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=false
          for i in $(seq 1 12); do
            if git pull --rebase -X theirs origin master && git push origin HEAD:master; then pushed=true; break; fi
            sleep_for=$((5 + i + RANDOM % 4))
            echo "Push attempt $i failed; retrying after ${sleep_for}s"
            sleep "$sleep_for"
          done
          if [ "$pushed" != "true" ]; then echo "::error::Verified operating income NOT published"; exit 1; fi
