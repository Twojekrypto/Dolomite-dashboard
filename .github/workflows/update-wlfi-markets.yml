name: Update WLFI Markets

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-wlfi-markets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install existing pipeline dependencies
        run: pip install -r requirements.txt

      - name: Check WLFI classification and reconciliation
        run: python3 -m unittest discover -s tests -p 'test_wlfi*.py'

      - name: Generate complete same-block WLFI snapshot
        env:
          ALCHEMY_ETHEREUM_RPC_KAT: ${{ secrets.ALCHEMY_ETHEREUM_RPC_KAT }}
          ALCHEMY_ETHEREUM_RPC_DAN: ${{ secrets.ALCHEMY_ETHEREUM_RPC_DAN }}
          ALCHEMY_ETHEREUM_RPC_ZEN: ${{ secrets.ALCHEMY_ETHEREUM_RPC_ZEN }}
        run: python3 generate_wlfi_markets.py

      - name: Commit and push verified snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wlfi-markets/latest.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update WLFI Markets snapshot: $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=false
          for i in $(seq 1 12); do
            if git pull --rebase -X theirs origin master && git push origin HEAD:master; then
              pushed=true
              break
            fi
            sleep_for=$((5 + i))
            if [ "$sleep_for" -gt 30 ]; then sleep_for=30; fi
            sleep_for=$((sleep_for + (RANDOM % 4)))
            echo "Push attempt $i failed, retrying after ${sleep_for}s..."
            sleep "$sleep_for"
          done
          if [ "$pushed" != "true" ]; then echo "::error::WLFI snapshot not published after 12 attempts"; exit 1; fi
