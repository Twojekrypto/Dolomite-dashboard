name: Backfill EARN Canonical Coverage

on:
  schedule:
    - cron: '11 */2 * * *'
  workflow_dispatch:
    inputs:
      chain:
        description: 'Chain to backfill; all runs active per-chain queues in parallel.'
        required: false
        type: choice
        default: all
        options:
          - all
          - ethereum
          - mantle
          - arbitrum
          - berachain

permissions:
  actions: write
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    concurrency:
      group: ${{ matrix.concurrency_group }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          # Ethereum's freshness lane only advances already-built histories.
          # Keep new-wallet archive backfills checkpointed here so four slow
          # wallets cannot hold 3K+ current wallets behind the SLA.
          - chain: ethereum
            concurrency_group: earn-ethereum-canonical-coverage
            limit: 8
            scan_workers: 2
            materialize_workers: 2
          - chain: mantle
            concurrency_group: earn-secondary-canonical-history-mantle
            limit: 200
            scan_workers: 8
            materialize_workers: 8
          - chain: arbitrum
            concurrency_group: earn-arbitrum-canonical-history
            limit: 120
            scan_workers: 12
            materialize_workers: 12
          - chain: berachain
            concurrency_group: earn-berachain-canonical-history
            limit: 120
            scan_workers: 8
            materialize_workers: 8
    env:
      PYTHONUNBUFFERED: '1'
      CHAIN: ${{ matrix.chain }}
      COVERAGE_LIMIT: ${{ matrix.limit }}
      SCAN_WORKERS: ${{ matrix.scan_workers }}
      MATERIALIZE_WORKERS: ${{ matrix.materialize_workers }}
      ALCHEMY_ETHEREUM_RPC: ${{ secrets.ALCHEMY_ETHEREUM_RPC }}
      ALCHEMY_ETHEREUM_RPC_KAT: ${{ secrets.ALCHEMY_ETHEREUM_RPC_KAT }}
      ALCHEMY_ETHEREUM_RPC_DAN: ${{ secrets.ALCHEMY_ETHEREUM_RPC_DAN }}
      ALCHEMY_ETHEREUM_RPC_ZEN: ${{ secrets.ALCHEMY_ETHEREUM_RPC_ZEN }}
      ALCHEMY_ETHEREUM_RPC_2: ${{ secrets.ALCHEMY_ETHEREUM_RPC_2 }}
      ALCHEMY_ETHEREUM_RPC_3: ${{ secrets.ALCHEMY_ETHEREUM_RPC_3 }}
      ALCHEMY_ARBITRUM_RPC: ${{ secrets.ALCHEMY_ARBITRUM_RPC || secrets.ARBITRUM_RPC_URL || secrets.ARBITRUM_RPC }}
      ALCHEMY_ARBITRUM_RPC_KAT: ${{ secrets.ALCHEMY_ARBITRUM_RPC_KAT }}
      ALCHEMY_ARBITRUM_RPC_DAN: ${{ secrets.ALCHEMY_ARBITRUM_RPC_DAN }}
      ALCHEMY_ARBITRUM_RPC_ZEN: ${{ secrets.ALCHEMY_ARBITRUM_RPC_ZEN }}
      ALCHEMY_ARBITRUM_RPC_2: ${{ secrets.ALCHEMY_ARBITRUM_RPC_2 }}
      ALCHEMY_ARBITRUM_RPC_3: ${{ secrets.ALCHEMY_ARBITRUM_RPC_3 }}
      ALCHEMY_BERACHAIN_RPC: ${{ secrets.ALCHEMY_BERACHAIN_RPC }}
      QUICKNODE_BERACHAIN_RPC_2: ${{ secrets.QUICKNODE_BERACHAIN_RPC_2 }}
      DRPC_BERACHAIN_RPC_ZEN: ${{ secrets.DRPC_BERACHAIN_RPC_ZEN }}
      ALCHEMY_BERACHAIN_RPC_2: ${{ secrets.ALCHEMY_BERACHAIN_RPC_2 }}
      ALCHEMY_BERACHAIN_RPC_3: ${{ secrets.ALCHEMY_BERACHAIN_RPC_3 }}
      MANTLE_RPC: ${{ secrets.MANTLE_RPC }}
      MANTLE_RPC_2: ${{ secrets.MANTLE_RPC_2 }}
      QUICKNODE_MANTLE_RPC: ${{ secrets.QUICKNODE_MANTLE_RPC }}
      QUICKNODE_MANTLE_RPC_2: ${{ secrets.QUICKNODE_MANTLE_RPC_2 }}
      MANTLE_RPC_QUICKNODE_TWOJE: ${{ secrets.MANTLE_RPC_QUICKNODE_TWOJE }}
      DRPC_MANTLE_RPC: ${{ secrets.DRPC_MANTLE_RPC }}
      DRPC_MANTLE_RPC_ZEN: ${{ secrets.DRPC_MANTLE_RPC_ZEN }}
      ALCHEMY_MANTLE_RPC_ZEN: ${{ secrets.ALCHEMY_MANTLE_RPC_ZEN }}
      ALCHEMY_MANTLE_RPC_DANU: ${{ secrets.ALCHEMY_MANTLE_RPC_DANU }}
      ALCHEMY_MANTLE_RPC: ${{ secrets.ALCHEMY_MANTLE_RPC }}
      ALCHEMY_MANTLE_RPC_2: ${{ secrets.ALCHEMY_MANTLE_RPC_2 }}
      ALCHEMY_MANTLE_RPC_3: ${{ secrets.ALCHEMY_MANTLE_RPC_3 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Restore canonical coverage checkpoint
        uses: actions/cache/restore@v5
        with:
          path: data/earn-coverage-runtime/${{ matrix.chain }}
          key: earn-canonical-coverage-${{ matrix.chain }}-${{ github.run_id }}
          restore-keys: |
            earn-canonical-coverage-${{ matrix.chain }}-

      - name: Select next canonical coverage cohort
        id: select
        run: |
          set -euo pipefail
          requested="${{ github.event.inputs.chain || 'all' }}"
          selection_path="/tmp/earn-${CHAIN}-coverage-addresses.txt"
          metadata_path="/tmp/earn-${CHAIN}-coverage-addresses.json"
          runtime_root="data/earn-coverage-runtime/${CHAIN}"
          active_selection="${runtime_root}/active-selection.txt"
          if [ "$requested" != "all" ] && [ "$requested" != "$CHAIN" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$runtime_root"
          if [ -s "$active_selection" ]; then
            cp "$active_selection" "$selection_path"
            echo "Resuming active ${CHAIN} canonical cohort."
          else
            selector_args=(
              python3 select_earn_canonical_hot_addresses.py
              --chain "$CHAIN"
              --limit "$COVERAGE_LIMIT"
              --coverage-backfill
              --priority-address-file config/earn_canonical_priority_addresses.txt
              --include-priority-even-if-unknown
              --output "$selection_path"
              --metadata-output "$metadata_path"
            )
            chain_priority="config/earn_${CHAIN}_canonical_hot_addresses.txt"
            if [ -f "$chain_priority" ]; then
              selector_args+=(--priority-address-file "$chain_priority")
            fi
            "${selector_args[@]}"
            cat "$metadata_path"
            cp "$selection_path" "$active_selection"
          fi
          selected_count="$(grep -c '^0x' "$selection_path" || true)"
          if [ "$selected_count" -eq 0 ]; then
            rm -f "$active_selection"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          selection_hash="$(sha256sum "$selection_path" | cut -d' ' -f1)"
          events_dir="data/earn-coverage-runtime/${CHAIN}/${selection_hash}/events"
          history_dir="data/earn-coverage-runtime/${CHAIN}/${selection_hash}/history"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "selection_path=$selection_path" >> "$GITHUB_OUTPUT"
          echo "selected_count=$selected_count" >> "$GITHUB_OUTPUT"
          echo "selection_hash=$selection_hash" >> "$GITHUB_OUTPUT"
          echo "events_dir=$events_dir" >> "$GITHUB_OUTPUT"
          echo "history_dir=$history_dir" >> "$GITHUB_OUTPUT"

      - name: Run one-pass canonical coverage backfill
        id: coverage
        if: steps.select.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          complete=false
          status_path="/tmp/earn-${CHAIN}-coverage-status.json"
          for step in $(seq 1 150); do
            python3 run_earn_data_correctness_pipeline.py continue \
              --chain "$CHAIN" \
              --selection-address-file "${{ steps.select.outputs.selection_path }}" \
              --events-dir "${{ steps.select.outputs.events_dir }}" \
              --history-dir "${{ steps.select.outputs.history_dir }}" \
              --max-scan-workers "$SCAN_WORKERS" \
              --max-materialize-workers "$MATERIALIZE_WORKERS" \
              --repair-limit "$COVERAGE_LIMIT" > "$status_path"
            complete="$(jq -r '(.scanComplete == true) and (.materializeComplete == true) and (.repairComplete == true)' "$status_path")"
            if [ "$complete" = "true" ]; then
              break
            fi
            if [ "$step" -eq 1 ] || [ $((step % 15)) -eq 0 ]; then
              cat "$status_path"
            fi
            sleep 20
          done
          scan_complete="$(jq -r '.scanComplete == true' "$status_path")"
          locked_target_block="$(jq -r '.lockedTargetBlock // 0' "$status_path")"
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          echo "scan_complete=$scan_complete" >> "$GITHUB_OUTPUT"
          echo "locked_target_block=$locked_target_block" >> "$GITHUB_OUTPUT"
          if [ "$complete" != "true" ]; then
            echo "Coverage checkpoint saved; the next scheduled run will resume the same cohort."
          fi

      - name: Select publishable canonical histories
        id: publishable
        if: steps.coverage.outputs.scan_complete == 'true'
        run: |
          set -euo pipefail
          publishable_path="/tmp/earn-${CHAIN}-publishable-addresses.txt"
          metadata_path="/tmp/earn-${CHAIN}-publishable-addresses.json"
          python3 scripts/select_earn_publishable_histories.py \
            --chain "$CHAIN" \
            --selection-address-file "${{ steps.select.outputs.selection_path }}" \
            --history-dir "${{ steps.select.outputs.history_dir }}" \
            --target-block "${{ steps.coverage.outputs.locked_target_block }}" \
            --output "$publishable_path" \
            --metadata-output "$metadata_path"
          count="$(grep -c '^0x' "$publishable_path" || true)"
          if [ "${{ steps.coverage.outputs.complete }}" = "true" ] && [ "$count" -ne "${{ steps.select.outputs.selected_count }}" ]; then
            cat "$metadata_path"
            echo "Completed cohort exposed only $count/${{ steps.select.outputs.selected_count }} publishable histories."
            exit 1
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "path=$publishable_path" >> "$GITHUB_OUTPUT"

      - name: Publish completed canonical histories
        if: steps.coverage.outputs.scan_complete == 'true' && steps.publishable.outputs.count != '0'
        run: |
          set -euo pipefail
          source_dir="${{ steps.select.outputs.history_dir }}/${CHAIN}"
          target_dir="data/earn-subaccount-history/${CHAIN}"
          mkdir -p "$target_dir"
          while IFS= read -r address; do
            [ -n "$address" ] || continue
            source_path="${source_dir}/${address}.json"
            [ -f "$source_path" ] || { echo "Missing completed history: $source_path"; exit 1; }
            cp "$source_path" "${target_dir}/${address}.json"
          done < "${{ steps.publishable.outputs.path }}"
          python3 scripts/sync_earn_subaccount_manifest.py --chain "$CHAIN"

      - name: Build verified ledger and public shards
        if: steps.coverage.outputs.scan_complete == 'true' && steps.publishable.outputs.count != '0'
        run: |
          set -euo pipefail
          python3 build_earn_resolved_interest_ledger.py \
            --chain "$CHAIN" \
            --address-file "${{ steps.publishable.outputs.path }}"
          python3 build_earn_verified_ledger.py \
            --chain "$CHAIN" \
            --address-file "${{ steps.publishable.outputs.path }}"
          python3 build_earn_verified_ledger_shards.py \
            --chain "$CHAIN" \
            --address-file "${{ steps.publishable.outputs.path }}"

      - name: Run EARN audit checks
        if: steps.coverage.outputs.scan_complete == 'true' && steps.publishable.outputs.count != '0'
        run: python3 run_earn_audit_checks.py

      - name: Commit publishable canonical coverage
        if: steps.coverage.outputs.scan_complete == 'true' && steps.publishable.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          EARN_DISPATCH_PAGES_AFTER_PUSH: 'false'
          EARN_DISPATCH_FRESHNESS_AFTER_PUSH: 'true'
          EARN_FRESHNESS_ALLOW_REMEDIATION_AFTER_PUSH: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]' && 'false' || 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/earn-subaccount-history/manifest.json data/earn-verified-ledger/manifest.json
          git add -f data/earn-resolved-interest-ledger/manifest.json
          while IFS= read -r address; do
            [ -n "$address" ] || continue
            git add -f "data/earn-subaccount-history/${CHAIN}/${address}.json"
            git add -f "data/earn-verified-ledger/${CHAIN}/${address}.json"
            resolved_path="data/earn-resolved-interest-ledger/${CHAIN}/${address}.json"
            if [ -f "$resolved_path" ] || git ls-files --error-unmatch "$resolved_path" >/dev/null 2>&1; then
              git add -f -- "$resolved_path"
            fi
          done < "${{ steps.publishable.outputs.path }}"
          git add -f data/earn-verified-ledger-shards
          bash scripts/commit_with_fresh_earn_status.sh "Backfill ${CHAIN} canonical EARN coverage - $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Close completed canonical coverage cohort
        if: steps.coverage.outputs.complete == 'true' && steps.publishable.outputs.count != '0'
        run: |
          rm -f "data/earn-coverage-runtime/${CHAIN}/active-selection.txt"
          rm -rf "data/earn-coverage-runtime/${CHAIN}/${{ steps.select.outputs.selection_hash }}"

      - name: Report incomplete canonical coverage progress
        if: steps.coverage.outputs.complete != 'true' && steps.select.outputs.skipped != 'true'
        run: |
          echo "Canonical coverage remains checkpointed for ${CHAIN}."
          find "data/earn-coverage-runtime/${CHAIN}" -maxdepth 8 -path '*/.progress/*.json' -type f -print -exec tail -n 30 {} \; || true
          find "data/earn-coverage-runtime/${CHAIN}" -maxdepth 8 -path '*/.logs/*.log' -type f -print -exec tail -n 20 {} \; || true

      - name: Save canonical coverage checkpoint
        if: always() && steps.select.outputs.skipped != 'true'
        uses: actions/cache/save@v5
        with:
          path: data/earn-coverage-runtime/${{ matrix.chain }}
          key: earn-canonical-coverage-${{ matrix.chain }}-${{ github.run_id }}
