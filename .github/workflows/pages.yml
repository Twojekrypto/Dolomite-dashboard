name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
  workflow_run:
    workflows:
      - Update DOLO Flows Data
      - Update DOLO Liquidity
      - Update oDOLO Data
      - Update veDOLO Data
      - Update veDOLO Flows
      - Update TVL Data
      - Update Supply Health
      - Update Rewards Programs
      - Audit Dolomite Revenue Onchain
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: master

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Validate generated EARN assets
        run: python3 build_earn_bundle.py --check

      - name: Audit representative EARN markets
        run: python3 build_earn_representative_audit.py --check

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'node_modules/' \
            ./ _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    steps:
      # GitHub's deployment API intermittently returns 503; deploy-pages does
      # not retry on its own, so retry up to two more times with a backoff.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        env:
          NODE_OPTIONS: --no-deprecation

      - name: Wait before deploy retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry 1)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
        env:
          NODE_OPTIONS: --no-deprecation

      - name: Wait before second deploy retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry 2)
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v5
        env:
          NODE_OPTIONS: --no-deprecation

      - name: Checkout smoke scripts
        uses: actions/checkout@v6

      - name: Smoke test live Pages
        run: python3 scripts/smoke_live_pages.py "${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry2.outputs.page_url }}"
