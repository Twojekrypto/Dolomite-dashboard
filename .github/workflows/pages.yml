name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
  workflow_run:
    workflows:
      - Update Assets Live Data
      - Update DOLO Price
      - Update TVL Data
      - Update veDOLO Data
      - Update DOLO Flows Data
      - Update Earn Snapshots
      - Update Earn Netflow Data
      - Update Earn Merkl Rewards
      - Update Berachain Earn Netflow Data
      - Monitor EARN Freshness
      - Refresh Ethereum Canonical EARN History
      - Refresh Arbitrum Canonical EARN History
      - Refresh Berachain Canonical EARN History
      - Refresh Secondary Canonical EARN History
      - Refresh Berachain Borrow-Route EARN History
      - Update Liquidation Risk Data
      - Update oDOLO Data
      - Update oDOLO Flows
      - Update veDOLO Flows
      - Update Supply History
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: master

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'node_modules/' \
            ./ _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        env:
          NODE_OPTIONS: --no-deprecation

      - name: Checkout smoke scripts
        uses: actions/checkout@v6

      - name: Smoke test live Pages
        run: python3 scripts/smoke_live_pages.py "${{ steps.deployment.outputs.page_url }}"
