name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout_source
        uses: actions/checkout@v5
        continue-on-error: true
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: master

      - name: Fallback source download
        if: steps.checkout_source.outcome != 'success'
        run: |
          set -euo pipefail
          echo "actions/checkout failed; downloading public source archive for ${GITHUB_SHA}."
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          archive="/tmp/dolomite-dashboard-source.tar.gz"
          curl -fsSL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" \
            -o "$archive"
          tar -xzf "$archive" --strip-components=1
          rm -f "$archive"
          test -f index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'node_modules/' \
            ./ _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        env:
          NODE_OPTIONS: --no-deprecation

      - name: Checkout smoke scripts
        id: checkout_smoke
        uses: actions/checkout@v5
        continue-on-error: true

      - name: Fallback smoke script download
        if: steps.checkout_smoke.outcome != 'success'
        run: |
          set -euo pipefail
          echo "actions/checkout failed; downloading smoke script archive for ${GITHUB_SHA}."
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          archive="/tmp/dolomite-dashboard-smoke.tar.gz"
          curl -fsSL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" \
            -o "$archive"
          tar -xzf "$archive" --strip-components=1
          rm -f "$archive"
          test -f scripts/smoke_live_pages.py

      - name: Smoke test live Pages
        run: python3 scripts/smoke_live_pages.py "${{ steps.deployment.outputs.page_url }}"
