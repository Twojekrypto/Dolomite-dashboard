name: Update TVL Data

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tvl-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch DeFi Llama data
        run: python3 fetch_defillama.py

      - name: Fetch Official Dolomite TVL
        run: python3 fetch_dolomite_tvl.py

      - name: Fetch Dolomite Revenue
        run: python3 fetch_dolomite_revenue.py

      - name: Validate TVL data
        run: python3 validate_data.py defillama_data.json dolomite_tvl.json dolomite_revenue.json

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add defillama_data.json dolomite_tvl.json dolomite_revenue.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "📊 Auto-update TVL: $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=false
          for i in $(seq 1 12); do
            if git pull --rebase -X theirs origin master && git push; then
              pushed=true
              break
            fi
            echo "⚠️ Push attempt $i failed, retrying..."
            sleep $((i * 5))
          done
          if [ "$pushed" != "true" ]; then
            echo "❌ Failed to push after 12 attempts."
            exit 1
          fi
