name: Secret Leak Guard

# Blocks any commit/PR that would publish an API key or credential to the
# public GitHub Pages site. Added after an Alchemy RPC key leaked into a
# committed data file. See scripts/check_secret_leak.py for the patterns.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_scan:
        description: "Scan every tracked file (slower) instead of just changed files"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Determine files to scan
        id: files
        run: |
          set -euo pipefail
          ensure_commit() {
            local sha="$1"
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$sha"
          }
          full="${{ github.event.inputs.full_scan }}"
          if [ "$full" = "true" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            : > changed.txt
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            ensure_commit "$base"
            git diff --name-only --diff-filter=ACMR "$base" "${{ github.sha }}" > changed.txt
            echo "mode=changed" >> "$GITHUB_OUTPUT"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              echo "mode=full" >> "$GITHUB_OUTPUT"
              : > changed.txt
            else
              ensure_commit "$before"
              git diff --name-only --diff-filter=ACMR "$before" "${{ github.sha }}" > changed.txt
              echo "mode=changed" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "Files to scan:"; cat changed.txt || true

      - name: Run secret-leak guard
        run: |
          set -euo pipefail
          if [ "${{ steps.files.outputs.mode }}" = "full" ]; then
            python3 scripts/check_secret_leak.py
          elif [ ! -s changed.txt ]; then
            echo "No added/modified files to scan."
          else
            # Pass only files that still exist (deletes are filtered by diff-filter).
            xargs -a changed.txt -d '\n' --no-run-if-empty python3 scripts/check_secret_leak.py
          fi
