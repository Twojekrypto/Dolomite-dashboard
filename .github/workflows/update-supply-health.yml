name: Update Supply Health

on:
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-supply-health
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate Supply Pool Health data
        run: python3 generate_supply_health.py

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/supply-health
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "🩺 Auto-update Supply Health: $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=false
          for i in $(seq 1 12); do
            if git pull --rebase -X theirs origin master && git push origin HEAD:master; then pushed=true; break; fi
            sleep_for=$((5 + i))
            if [ "$sleep_for" -gt 30 ]; then sleep_for=30; fi
            sleep_for=$((sleep_for + (RANDOM % 4)))
            echo "⚠️ Push attempt $i failed, retrying after ${sleep_for}s..."
            sleep "$sleep_for"
          done
          if [ "$pushed" != "true" ]; then echo "::error::Failed to push after 12 attempts. Supply Health data NOT published"; exit 1; fi
