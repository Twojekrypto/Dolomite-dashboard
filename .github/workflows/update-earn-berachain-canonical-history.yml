name: Refresh Berachain Canonical EARN History

on:
  schedule:
    - cron: '7,37 * * * *'  # Checkpointed 30m chunks; keeps Berachain moving without multi-hour lockups
  workflow_dispatch:

concurrency:
  group: earn-berachain-canonical-history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      CHAIN: berachain
      BOOTSTRAP_HOT_LIMIT: '500'
      STEADY_HOT_LIMIT: '500'
      CHECKPOINT_STEPS: '150'
      CHECKPOINT_SLEEP_SECONDS: '20'
      ALCHEMY_BERACHAIN_RPC: ${{ secrets.ALCHEMY_BERACHAIN_RPC }}
      QUICKNODE_BERACHAIN_RPC_2: ${{ secrets.QUICKNODE_BERACHAIN_RPC_2 }}
      DRPC_BERACHAIN_RPC_ZEN: ${{ secrets.DRPC_BERACHAIN_RPC_ZEN }}
      ALCHEMY_BERACHAIN_RPC_2: ${{ secrets.ALCHEMY_BERACHAIN_RPC_2 }}
      ALCHEMY_BERACHAIN_RPC_3: ${{ secrets.ALCHEMY_BERACHAIN_RPC_3 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip requests

      - name: Check Berachain RPC redundancy
        run: |
          set -euo pipefail
          configured=0
          for name in ALCHEMY_BERACHAIN_RPC QUICKNODE_BERACHAIN_RPC_2 DRPC_BERACHAIN_RPC_ZEN ALCHEMY_BERACHAIN_RPC_2 ALCHEMY_BERACHAIN_RPC_3; do
            if [ -n "${!name:-}" ]; then
              configured=$((configured + 1))
            fi
          done
          echo "Configured Berachain RPC secrets: ${configured}/5"
          if [ "$configured" -eq 0 ]; then
            echo "::error title=Berachain RPC missing::Set at least ALCHEMY_BERACHAIN_RPC in repository secrets."
            exit 1
          fi
          if [ "$configured" -lt 2 ]; then
            echo "::warning title=Berachain RPC redundancy::Only ${configured} Berachain RPC secret is configured. Add QUICKNODE_BERACHAIN_RPC_2, DRPC_BERACHAIN_RPC_ZEN, ALCHEMY_BERACHAIN_RPC_2, or ALCHEMY_BERACHAIN_RPC_3 for better failover."
          fi

      - name: Restore Berachain canonical runtime cache
        uses: actions/cache@v5
        with:
          path: |
            data/earn-subaccount-history-events
            data/earn-subaccount-history/.progress
            data/earn-subaccount-history/.repair-plans
            data/earn-subaccount-history/.incremental-plans
            data/earn-subaccount-history/berachain
          key: earn-canonical-runtime-berachain-${{ github.run_id }}
          restore-keys: |
            earn-canonical-runtime-berachain-

      - name: Select Berachain hot wallets
        run: |
          set -euo pipefail
          read -r has_public_baseline hot_limit <<< "$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("data/earn-subaccount-history/manifest.json")
          try:
              manifest = json.loads(manifest_path.read_text())
          except Exception:
              manifest = {}
          chain = (manifest.get("chains") or {}).get("berachain") or {}
          try:
              has_public_baseline = int(chain.get("lastBlock") or 0) > 0
          except Exception:
              has_public_baseline = False
          hot_limit = os.environ["STEADY_HOT_LIMIT"] if has_public_baseline else os.environ["BOOTSTRAP_HOT_LIMIT"]
          print("true" if has_public_baseline else "false", hot_limit)
          PY
          )"
          echo "Berachain hot wallet limit: ${hot_limit}"
          selector_args=(
            python3 select_earn_canonical_hot_addresses.py
            --chain "$CHAIN"
            --limit "$hot_limit"
            --priority-address-file config/earn_canonical_priority_addresses.txt
            --priority-address-file config/earn_berachain_canonical_hot_addresses.txt
            --include-priority-even-if-unknown
            --output "/tmp/earn-${CHAIN}-canonical-hot-addresses.txt"
            --metadata-output "/tmp/earn-${CHAIN}-canonical-hot-addresses.json"
          )
          if [ "$has_public_baseline" = "true" ]; then
            selector_args+=(--existing-history-only --history-dir data/earn-subaccount-history)
          fi
          "${selector_args[@]}"
          cat "/tmp/earn-${CHAIN}-canonical-hot-addresses.json"

      - name: Refresh Berachain canonical history checkpoint
        id: refresh
        run: |
          set -euo pipefail
          status_path="/tmp/earn-${CHAIN}-canonical-refresh.json"
          python3 run_earn_canonical_history_refresh.py \
            --chain "$CHAIN" \
            --selection-address-file "/tmp/earn-${CHAIN}-canonical-hot-addresses.txt" \
            --max-scan-workers 8 \
            --max-materialize-workers 8 \
            --max-incremental-scan-workers 10 \
            --max-incremental-apply-workers 10 \
            --max-new-backfill-workers 4 \
            --max-steps "$CHECKPOINT_STEPS" \
            --sleep-seconds "$CHECKPOINT_SLEEP_SECONDS" \
            --allow-empty \
            --skip-unsupported-start-block \
            --allow-checkpoint-incomplete \
            --status-output "$status_path"
          cat "$status_path"
          complete="$(python3 - "$status_path" <<'PY'
          import json
          import sys
          payload = json.load(open(sys.argv[1]))
          print("true" if payload.get("complete") else "false")
          PY
          )"
          skipped="$(python3 - "$status_path" <<'PY'
          import json
          import sys
          payload = json.load(open(sys.argv[1]))
          print("true" if payload.get("skipped") else "false")
          PY
          )"
          echo "complete=${complete}" >> "$GITHUB_OUTPUT"
          echo "skipped=${skipped}" >> "$GITHUB_OUTPUT"
          if [ "$complete" != "true" ]; then
            echo "Canonical history checkpoint saved; later scheduled runs will continue from cache."
          fi

      - name: Build Berachain verified ledger cache
        if: steps.refresh.outputs.complete == 'true' && steps.refresh.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          python3 build_earn_verified_ledger.py \
            --chain "$CHAIN" \
            --address-file "/tmp/earn-${CHAIN}-canonical-hot-addresses.txt"
        env:
          PYTHONUNBUFFERED: '1'

      - name: Save Berachain canonical runtime cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            data/earn-subaccount-history-events
            data/earn-subaccount-history/.progress
            data/earn-subaccount-history/.repair-plans
            data/earn-subaccount-history/.incremental-plans
            data/earn-subaccount-history/berachain
          key: earn-canonical-runtime-berachain-${{ github.run_id }}

      - name: Run EARN audit checks
        if: steps.refresh.outputs.complete == 'true' && steps.refresh.outputs.skipped != 'true'
        run: python3 run_earn_audit_checks.py

      - name: Commit and push refreshed canonical history
        if: steps.refresh.outputs.complete == 'true' && steps.refresh.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/earn-subaccount-history/manifest.json
          if [ -d "data/earn-subaccount-history/${CHAIN}" ]; then
            git add -f "data/earn-subaccount-history/${CHAIN}"
          fi
          git add -f data/earn-verified-ledger/manifest.json
          if [ -d "data/earn-verified-ledger/${CHAIN}" ]; then
            git add -f "data/earn-verified-ledger/${CHAIN}"
          fi
          if git diff --staged --quiet; then
            echo "No canonical history changes to commit"
            exit 0
          fi
          git commit -m "Refresh Berachain canonical EARN history - $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin master && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
