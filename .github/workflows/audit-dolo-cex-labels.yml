name: Audit DOLO CEX Labels

on:
  schedule:
    - cron: '43 6 * * 1'  # weekly, Monday 06:43 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-dolo-cex-labels
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check DeBank label browser
        run: |
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            echo "::warning::Chrome/Chromium unavailable; direct DeBank CEX badge checks will be skipped."
          fi

      - name: Run DOLO CEX label audit
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          DOLO_CEX_DEBANK_MAX_CANDIDATES: '20'
        run: python3 audit_dolo_cex_labels.py --output dolo_cex_label_audit.json --state-file dolo_cex_label_audit_state.json

      - name: Build committed summary
        run: |
          python3 - <<'PY'
          import json, datetime
          full = json.load(open("dolo_cex_label_audit.json"))
          api = full.get("api") or {}
          summary = {
              "generatedAt": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "apiStatus": api.get("status"),
              "debankStatus": api.get("debankStatus"),
              "debankRotation": full.get("debankRotation") or {},
              "confirmedCexSuggestions": api.get("confirmedCexSuggestions", [])[:20],
              "topRankedCandidates": full.get("rankedCandidates", [])[:20],
          }
          with open("dolo_cex_label_audit_summary.json", "w") as f:
              json.dump(summary, f, indent=2)
          print(json.dumps(summary, indent=2)[:1500])
          PY

      - name: Upload full audit report
        uses: actions/upload-artifact@v6
        with:
          name: dolo-cex-label-audit
          path: dolo_cex_label_audit.json

      - name: Commit summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dolo_cex_label_audit_summary.json dolo_cex_label_audit_state.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔎 CEX label audit summary $(date -u '+%Y-%m-%d')"
            pushed=false
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin master && git push origin master; then pushed=true; break; fi
              echo "⚠️ Push attempt $i failed, retrying..."
              sleep 5
            done
            if [ "$pushed" != "true" ]; then echo "::error::Push failed after 3 attempts — data NOT published"; exit 1; fi
          fi
