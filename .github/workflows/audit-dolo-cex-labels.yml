name: Audit DOLO CEX Labels

on:
  schedule:
    - cron: '43 6 * * *'  # daily, bounded rotating discovery
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: audit-dolo-cex-labels
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check DeBank label browser
        run: |
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1 && ! command -v chromium-browser >/dev/null 2>&1; then
            echo "::error::Chrome/Chromium unavailable; cannot verify direct DeBank CEX badges."
            exit 1
          fi

      - name: Test CEX label evidence rules
        run: python3 -m unittest tests/test_audit_dolo_cex_labels.py

      - name: Run DOLO CEX label audit
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          DOLO_CEX_DEBANK_MAX_CANDIDATES: '20'
          DOLO_CEX_AUDIT_MAX_CANDIDATES: '20'
          DOLO_CEX_AUDIT_HOLDER_MIN: '10000'
          DOLO_CEX_AUDIT_FLOW_MIN: '10000'
        run: python3 audit_dolo_cex_labels.py --apply-confirmed --output dolo_cex_label_audit.json --state-file dolo_cex_label_audit_state.json

      - name: Validate shared labels
        run: node --check dolo-address-labels.js

      - name: Build committed summary
        run: |
          python3 - <<'PY'
          import json, datetime
          full = json.load(open("dolo_cex_label_audit.json"))
          api = full.get("api") or {}
          summary = {
              "generatedAt": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "apiStatus": api.get("status"),
              "debankStatus": api.get("debankStatus"),
              "debankRotation": full.get("debankRotation") or {},
              "existingCexEvidence": full.get("existingCexEvidence") or {},
              "confirmedCexSuggestions": api.get("confirmedCexSuggestions", [])[:20],
              "topRankedCandidates": full.get("rankedCandidates", [])[:20],
              "publication": full.get("publication") or {},
          }
          with open("dolo_cex_label_audit_summary.json", "w") as f:
              json.dump(summary, f, indent=2)
          print(json.dumps(summary, indent=2)[:1500])
          PY

      - name: Upload full audit report
        uses: actions/upload-artifact@v6
        with:
          name: dolo-cex-label-audit
          path: dolo_cex_label_audit.json

      - name: Commit summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dolo-address-labels.js dolo_cex_label_audit_summary.json dolo_cex_label_audit_state.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔎 CEX label audit summary $(date -u '+%Y-%m-%d')"
            pushed=false
            for i in $(seq 1 12); do
              git pull --rebase origin master || { echo "::error::Conflicting edits require review"; exit 1; }
              if git push origin master; then pushed=true; break; fi
              echo "⚠️ Push attempt $i failed, retrying..."
              sleep 5
            done
            if [ "$pushed" != "true" ]; then echo "::error::Push failed after 12 attempts — labels NOT published"; exit 1; fi
          fi

      - name: Rebuild affected holder and CEX history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python3 -c 'import json,sys; sys.exit(0 if json.load(open("dolo_cex_label_audit.json")).get("publication",{}).get("added") else 1)'; then
            gh workflow run update-dolo-flows.yml --ref master -f holder_history_only=true
          fi
