name: Refresh Secondary Canonical EARN History
run-name: Refresh Secondary Canonical EARN History [${{ github.event.inputs.chain || (github.event.schedule == '23,53 * * * *' && 'mantle') || (github.event.schedule == '28,58 * * * *' && 'botanix') || (github.event.schedule == '33 * * * *' && 'polygonzkevm') || (github.event.schedule == '38 * * * *' && 'xlayer') || 'all' }}]

on:
  schedule:
    - cron: '23,53 * * * *'  # Mantle only, staggered from primary chains
    - cron: '28,58 * * * *'  # Botanix only, staggered from Mantle
    - cron: '33 * * * *'     # Polygon zkEVM only
    - cron: '38 * * * *'     # X Layer only
  workflow_dispatch:
    inputs:
      chain:
        description: 'Secondary chain to refresh.'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - mantle
          - botanix
          - polygonzkevm
          - xlayer

permissions:
  actions: write
  contents: write

jobs:
  plan-secondary-canonical:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Plan selected secondary chains
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_CHAIN: ${{ github.event.inputs.chain || 'all' }}
        run: |
          set -euo pipefail
          matrix="$(python3 - <<'PY'
          import json
          import os
          import sys

          chains = {
              "mantle": {
                  "chain": "mantle",
                  "label": "Mantle",
                  "hot_limit": 100,
                  "scan_workers": 6,
                  "materialize_workers": 6,
                  "incremental_scan_workers": 6,
                  "incremental_apply_workers": 6,
                  "checkpoint_steps": 60,
              },
              "botanix": {
                  "chain": "botanix",
                  "label": "Botanix",
                  "hot_limit": 500,
                  "scan_workers": 4,
                  "materialize_workers": 4,
                  "incremental_scan_workers": 4,
                  "incremental_apply_workers": 4,
                  "checkpoint_steps": 45,
              },
              "polygonzkevm": {
                  "chain": "polygonzkevm",
                  "label": "Polygon zkEVM",
                  "hot_limit": 750,
                  "scan_workers": 5,
                  "materialize_workers": 5,
                  "incremental_scan_workers": 5,
                  "incremental_apply_workers": 5,
                  "checkpoint_steps": 90,
              },
              "xlayer": {
                  "chain": "xlayer",
                  "label": "X Layer",
                  "hot_limit": 300,
                  "scan_workers": 5,
                  "materialize_workers": 5,
                  "incremental_scan_workers": 5,
                  "incremental_apply_workers": 5,
                  "checkpoint_steps": 45,
              },
          }
          event_name = os.environ.get("EVENT_NAME") or ""
          schedule = os.environ.get("EVENT_SCHEDULE") or ""
          dispatch_chain = (os.environ.get("DISPATCH_CHAIN") or "all").strip().lower()

          if event_name == "workflow_dispatch":
              if dispatch_chain in {"", "all"}:
                  selected = ["mantle", "botanix", "polygonzkevm", "xlayer"]
              elif dispatch_chain in chains:
                  selected = [dispatch_chain]
              else:
                  print(f"Unknown secondary canonical chain: {dispatch_chain}", file=sys.stderr)
                  sys.exit(1)
          elif event_name == "schedule" and schedule == "23,53 * * * *":
              selected = ["mantle"]
          elif event_name == "schedule" and schedule == "28,58 * * * *":
              selected = ["botanix"]
          elif event_name == "schedule" and schedule == "33 * * * *":
              selected = ["polygonzkevm"]
          elif event_name == "schedule" and schedule == "38 * * * *":
              selected = ["xlayer"]
          else:
              selected = []

          print(json.dumps({"include": [chains[chain] for chain in selected]}, separators=(",", ":")))
          PY
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Planned secondary canonical matrix: $matrix"

  refresh:
    needs: plan-secondary-canonical
    if: needs.plan-secondary-canonical.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-secondary-canonical.outputs.matrix) }}
    concurrency:
      group: earn-secondary-canonical-history-${{ matrix.chain }}
      cancel-in-progress: false
    env:
      PYTHONUNBUFFERED: '1'
      CHAIN: ${{ matrix.chain }}
      CHAIN_LABEL: ${{ matrix.label }}
      HOT_LIMIT: ${{ matrix.hot_limit }}
      SCAN_WORKERS: ${{ matrix.scan_workers }}
      MATERIALIZE_WORKERS: ${{ matrix.materialize_workers }}
      INCREMENTAL_SCAN_WORKERS: ${{ matrix.incremental_scan_workers }}
      INCREMENTAL_APPLY_WORKERS: ${{ matrix.incremental_apply_workers }}
      CHECKPOINT_STEPS: ${{ matrix.checkpoint_steps }}
      CHECKPOINT_SLEEP_SECONDS: '20'
      COMMAND_TIMEOUT_SECONDS: '180'
      MANTLE_RPC: ${{ secrets.MANTLE_RPC }}
      MANTLE_RPC_2: ${{ secrets.MANTLE_RPC_2 }}
      QUICKNODE_MANTLE_RPC: ${{ secrets.QUICKNODE_MANTLE_RPC }}
      QUICKNODE_MANTLE_RPC_2: ${{ secrets.QUICKNODE_MANTLE_RPC_2 }}
      MANTLE_RPC_QUICKNODE_TWOJE: ${{ secrets.MANTLE_RPC_QUICKNODE_TWOJE }}
      DRPC_MANTLE_RPC: ${{ secrets.DRPC_MANTLE_RPC }}
      DRPC_MANTLE_RPC_ZEN: ${{ secrets.DRPC_MANTLE_RPC_ZEN }}
      ALCHEMY_MANTLE_RPC_ZEN: ${{ secrets.ALCHEMY_MANTLE_RPC_ZEN }}
      ALCHEMY_MANTLE_RPC_DANU: ${{ secrets.ALCHEMY_MANTLE_RPC_DANU }}
      ALCHEMY_MANTLE_RPC: ${{ secrets.ALCHEMY_MANTLE_RPC }}
      ALCHEMY_MANTLE_RPC_2: ${{ secrets.ALCHEMY_MANTLE_RPC_2 }}
      ALCHEMY_MANTLE_RPC_3: ${{ secrets.ALCHEMY_MANTLE_RPC_3 }}
      BOTANIX_RPC: ${{ secrets.BOTANIX_RPC }}
      BOTANIX_RPC_2: ${{ secrets.BOTANIX_RPC_2 }}
      BOTANIX_RPC_3: ${{ secrets.BOTANIX_RPC_3 }}
      QUICKNODE_BOTANIX_RPC: ${{ secrets.QUICKNODE_BOTANIX_RPC }}
      QUICKNODE_BOTANIX_RPC_2: ${{ secrets.QUICKNODE_BOTANIX_RPC_2 }}
      DRPC_BOTANIX_RPC_ZEN: ${{ secrets.DRPC_BOTANIX_RPC_ZEN }}
      ALCHEMY_BOTANIX_RPC_ZEN: ${{ secrets.ALCHEMY_BOTANIX_RPC_ZEN }}
      ALCHEMY_BOTANIX_RPC: ${{ secrets.ALCHEMY_BOTANIX_RPC }}
      ALCHEMY_BOTANIX_RPC_2: ${{ secrets.ALCHEMY_BOTANIX_RPC_2 }}
      ALCHEMY_BOTANIX_RPC_3: ${{ secrets.ALCHEMY_BOTANIX_RPC_3 }}
      ALCHEMY_POLYGONZKEVM_RPC_ZEN: ${{ secrets.ALCHEMY_POLYGONZKEVM_RPC_ZEN }}
      DRP_POLYGONZKEVM_RPC_TWO: ${{ secrets.DRP_POLYGONZKEVM_RPC_TWO }}
      POLYGONZKEVM_RPC: ${{ secrets.POLYGONZKEVM_RPC }}
      POLYGONZKEVM_RPC_2: ${{ secrets.POLYGONZKEVM_RPC_2 }}
      XLAYER_RPC_QUICKNODE_TWOJE: ${{ secrets.XLAYER_RPC_QUICKNODE_TWOJE }}
      ALCHEMY_XLAYER_RPC_ZEN: ${{ secrets.ALCHEMY_XLAYER_RPC_ZEN }}
      DRP_XLAYER_RPC_TWO: ${{ secrets.DRP_XLAYER_RPC_TWO }}
      XLAYER_RPC: ${{ secrets.XLAYER_RPC }}
      XLAYER_RPC_2: ${{ secrets.XLAYER_RPC_2 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip requests

      - name: Check secondary RPC redundancy
        run: |
          set -euo pipefail
          case "$CHAIN" in
            mantle)
              names=(MANTLE_RPC MANTLE_RPC_2 QUICKNODE_MANTLE_RPC QUICKNODE_MANTLE_RPC_2 MANTLE_RPC_QUICKNODE_TWOJE DRPC_MANTLE_RPC DRPC_MANTLE_RPC_ZEN ALCHEMY_MANTLE_RPC_ZEN ALCHEMY_MANTLE_RPC_DANU ALCHEMY_MANTLE_RPC ALCHEMY_MANTLE_RPC_2 ALCHEMY_MANTLE_RPC_3)
              ;;
            botanix)
              names=(BOTANIX_RPC BOTANIX_RPC_2 BOTANIX_RPC_3 QUICKNODE_BOTANIX_RPC QUICKNODE_BOTANIX_RPC_2 DRPC_BOTANIX_RPC_ZEN ALCHEMY_BOTANIX_RPC_ZEN ALCHEMY_BOTANIX_RPC ALCHEMY_BOTANIX_RPC_2 ALCHEMY_BOTANIX_RPC_3)
              ;;
            *)
              exit 0
              ;;
          esac
          configured=0
          for name in "${names[@]}"; do
            if [ -n "${!name:-}" ]; then
              configured=$((configured + 1))
            fi
          done
          echo "Configured ${CHAIN} RPC secrets: ${configured}/${#names[@]}"
          if [ "$configured" -lt 2 ]; then
            echo "::warning title=${CHAIN} RPC redundancy::Only ${configured} dedicated ${CHAIN} RPC secret(s) are configured. Add a second provider secret for better failover."
          fi

      - name: Restore canonical runtime cache
        uses: actions/cache@v5
        with:
          path: |
            data/earn-subaccount-history-events
            data/earn-subaccount-history/.progress
            data/earn-subaccount-history/.repair-plans
            data/earn-subaccount-history/.incremental-plans
            data/earn-subaccount-history/${{ matrix.chain }}
          key: earn-canonical-runtime-${{ matrix.chain }}-${{ github.run_id }}
          restore-keys: |
            earn-canonical-runtime-${{ matrix.chain }}-

      - name: Select hot wallets
        run: |
          set -euo pipefail
          python3 select_earn_canonical_hot_addresses.py \
            --chain "$CHAIN" \
            --limit "$HOT_LIMIT" \
            --priority-address-file config/earn_canonical_priority_addresses.txt \
            --include-priority-even-if-unknown \
            --prefer-stale-history \
            --output "/tmp/earn-${CHAIN}-canonical-hot-addresses.txt" \
            --metadata-output "/tmp/earn-${CHAIN}-canonical-hot-addresses.json"
          cat "/tmp/earn-${CHAIN}-canonical-hot-addresses.json"

      - name: Refresh canonical history
        id: refresh
        run: |
          set -euo pipefail
          status_path="/tmp/earn-${CHAIN}-canonical-refresh.json"
          python3 run_earn_canonical_history_refresh.py \
            --chain "$CHAIN" \
            --selection-address-file "/tmp/earn-${CHAIN}-canonical-hot-addresses.txt" \
            --max-scan-workers "$SCAN_WORKERS" \
            --max-materialize-workers "$MATERIALIZE_WORKERS" \
            --max-incremental-scan-workers "$INCREMENTAL_SCAN_WORKERS" \
            --max-incremental-apply-workers "$INCREMENTAL_APPLY_WORKERS" \
            --max-new-backfill-workers 4 \
            --max-steps "$CHECKPOINT_STEPS" \
            --sleep-seconds "$CHECKPOINT_SLEEP_SECONDS" \
            --command-timeout-seconds "$COMMAND_TIMEOUT_SECONDS" \
            --allow-empty \
            --skip-unsupported-start-block \
            --allow-checkpoint-incomplete \
            --status-output "$status_path"
          cat "$status_path"
          complete="$(python3 - "$status_path" <<'PY'
          import json
          import sys
          payload = json.load(open(sys.argv[1]))
          print("true" if payload.get("complete") else "false")
          PY
          )"
          skipped="$(python3 - "$status_path" <<'PY'
          import json
          import sys
          payload = json.load(open(sys.argv[1]))
          print("true" if payload.get("skipped") else "false")
          PY
          )"
          echo "complete=${complete}" >> "$GITHUB_OUTPUT"
          echo "skipped=${skipped}" >> "$GITHUB_OUTPUT"
          if [ "$complete" != "true" ]; then
            echo "Canonical history checkpoint saved; later scheduled runs will continue from cache."
          fi

      - name: Build verified ledger cache
        if: steps.refresh.outputs.complete == 'true' && steps.refresh.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          python3 build_earn_verified_ledger.py \
            --chain "$CHAIN" \
            --address-file "/tmp/earn-${CHAIN}-canonical-hot-addresses.txt"
        env:
          PYTHONUNBUFFERED: '1'

      - name: Save canonical runtime cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            data/earn-subaccount-history-events
            data/earn-subaccount-history/.progress
            data/earn-subaccount-history/.repair-plans
            data/earn-subaccount-history/.incremental-plans
            data/earn-subaccount-history/${{ matrix.chain }}
          key: earn-canonical-runtime-${{ matrix.chain }}-${{ github.run_id }}

      - name: Run EARN audit checks
        if: steps.refresh.outputs.complete == 'true' && steps.refresh.outputs.skipped != 'true'
        run: python3 run_earn_audit_checks.py

      - name: Commit and push refreshed canonical history
        if: steps.refresh.outputs.complete == 'true' && steps.refresh.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EARN_DISPATCH_PAGES_AFTER_PUSH: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/earn-subaccount-history/manifest.json
          if [ -d "data/earn-subaccount-history/${CHAIN}" ]; then
            git add -f "data/earn-subaccount-history/${CHAIN}"
          fi
          git add -f data/earn-verified-ledger/manifest.json
          if [ -d "data/earn-verified-ledger/${CHAIN}" ]; then
            git add -f "data/earn-verified-ledger/${CHAIN}"
          fi
          bash scripts/commit_with_fresh_earn_status.sh "Refresh ${CHAIN_LABEL} canonical EARN history - $(date -u '+%Y-%m-%d %H:%M UTC')"
