name: Update DOLO Price

on:
  schedule:
    - cron: '17 * * * *'  # Hourly lightweight CoinGecko cache refresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dolo-price
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update DOLO price cache
        run: python3 update_dolo_price.py

      - name: Update DOLO daily price history
        run: python3 fetch_dolo_price_history.py

      - name: Validate DOLO price data
        run: python3 validate_data.py dolo_price.json dolo_price_history.json

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dolo_price.json dolo_price_history.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "📊 Auto-update DOLO price: $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin master && git push; then pushed=true; break; fi
            echo "⚠️ Push attempt $i failed, retrying..."
            sleep 5
          done
          if [ "$pushed" != "true" ]; then echo "::error::Push failed after 3 attempts — data NOT published"; exit 1; fi
