name: Update oDOLO Flows

on:
  schedule:
    - cron: '7 */6 * * *'  # Every 6 hours, staggered
  workflow_dispatch:

concurrency:
  group: odolo-data-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore flows sync state
        uses: actions/cache@v5
        with:
          path: |
            odolo_flows_state.json
            odolo_claim_events_state.json
            reward_claim_events_state.json
          key: odolo-flows-state-${{ github.run_number }}
          restore-keys: |
            odolo-flows-state-

      - name: Generate oDOLO flows
        env:
          PYTHONUNBUFFERED: '1'
          ALCHEMY_BERACHAIN_RPC: ${{ secrets.ALCHEMY_BERACHAIN_RPC }}
          ALCHEMY_BERACHAIN_RPC_2: ${{ secrets.ALCHEMY_BERACHAIN_RPC_2 }}
          ALCHEMY_BERACHAIN_RPC_3: ${{ secrets.ALCHEMY_BERACHAIN_RPC_3 }}
        run: python generate_odolo_flows.py

      - name: Generate reward claim events
        env:
          PYTHONUNBUFFERED: '1'
          ALCHEMY_BERACHAIN_RPC: ${{ secrets.ALCHEMY_BERACHAIN_RPC }}
          ALCHEMY_BERACHAIN_RPC_2: ${{ secrets.ALCHEMY_BERACHAIN_RPC_2 }}
          ALCHEMY_BERACHAIN_RPC_3: ${{ secrets.ALCHEMY_BERACHAIN_RPC_3 }}
          ALCHEMY_ARBITRUM_RPC: ${{ secrets.ALCHEMY_ARBITRUM_RPC }}
          ALCHEMY_ARBITRUM_RPC_2: ${{ secrets.ALCHEMY_ARBITRUM_RPC_2 }}
          ALCHEMY_ARBITRUM_RPC_3: ${{ secrets.ALCHEMY_ARBITRUM_RPC_3 }}
          ALCHEMY_MANTLE_RPC: ${{ secrets.ALCHEMY_MANTLE_RPC }}
          ALCHEMY_MANTLE_RPC_2: ${{ secrets.ALCHEMY_MANTLE_RPC_2 }}
          ALCHEMY_XLAYER_RPC: ${{ secrets.ALCHEMY_XLAYER_RPC }}
          REWARD_CLAIM_CHUNK_SIZE_BERACHAIN: '10000'
          REWARD_CLAIM_CHUNK_SIZE_ARBITRUM: '250000'
          REWARD_CLAIM_CHUNK_SIZE_MANTLE: '50000'
          REWARD_CLAIM_CHUNK_SIZE_XLAYER: '100000'
          REWARD_CLAIM_TIMESTAMP_BATCH_SIZE_MANTLE: '20'
          REWARD_CLAIM_TIMESTAMP_BATCH_SIZE_XLAYER: '20'
          REWARD_CLAIM_TIMESTAMP_BATCH_SIZE_BERACHAIN: '20'
          REWARD_CLAIM_TIMESTAMP_BATCH_SIZE_ARBITRUM: '50'
        run: python generate_reward_claim_events.py

      - name: Validate generated data
        run: python3 validate_data.py odolo_flows.json data/odolo-claim-events.json data/reward-claim-events.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add odolo_flows.json data/odolo-claim-events.json data/reward-claim-events.json data/reward-claim-events
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "🔄 Update oDOLO flows data — $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Retry push with rebase up to 3 times to handle concurrent pushes
          for i in 1 2 3; do
            git pull --rebase -X theirs origin master && git push && break
            echo "⚠️ Push attempt $i failed, retrying..."
            sleep 5
          done
