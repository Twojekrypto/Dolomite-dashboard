name: Update oDOLO Flows

on:
  schedule:
    - cron: '7 */6 * * *'  # Every 6 hours, staggered
  workflow_dispatch:

concurrency:
  group: odolo-flows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /requirements.txt
            /dolo-address-labels.js
            /odolo_flows.json
            /exercisers_by_address.json
            /vedolo_flows.json
            /data/odolo-claim-events.json
            /data/reward-claim-events.json
            /data/reward-claim-events/
            /tests/test_generate_odolo_flows.py
            /tests/test_generate_reward_claim_events.py
            /tests/test_odolo_workflow_recovery.py
            /tests/test_odolo_flows_validation.py
            /.github/workflows/update-odolo-flows.yml
            /.github/workflows/update-reward-claim-events.yml
            /config/dashboard_freshness.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test flow integrity and interrupted-scan recovery
        run: |
          python3 -m unittest discover -s tests -p 'test_generate_odolo_flows.py'
          python3 -m unittest discover -s tests -p 'test_odolo_workflow_recovery.py'
          python3 -m unittest discover -s tests -p 'test_generate_reward_claim_events.py'
          python3 -m unittest discover -s tests -p 'test_odolo_flows_validation.py'

      - name: Restore flows sync state
        id: flow_cache
        uses: actions/cache/restore@v5
        with:
          path: |
            odolo_flows_state.json
            odolo_claim_events_state.json
            reward_claim_events_state.json
            odolo_flow_checkpoints
          key: odolo-flows-state-v3-${{ github.run_number }}-${{ github.run_attempt }}
          restore-keys: |
            odolo-flows-state-v3-
            odolo-flows-state-

      - name: Generate Berachain reward claim events
        env:
          PYTHONUNBUFFERED: '1'
          ALCHEMY_BERACHAIN_RPC: ${{ secrets.ALCHEMY_BERACHAIN_RPC }}
          ALCHEMY_BERACHAIN_RPC_2_JEFF: ${{ secrets.ALCHEMY_BERACHAIN_RPC_2_JEFF }}
          ALCHEMY_BERACHAIN_RPC_2: ${{ secrets.ALCHEMY_BERACHAIN_RPC_2 }}
          ALCHEMY_BERACHAIN_RPC_3: ${{ secrets.ALCHEMY_BERACHAIN_RPC_3 }}
          DRPC_BERACHAIN_RPC_ZEN: ${{ secrets.DRPC_BERACHAIN_RPC_ZEN }}
          QUICKNODE_BERACHAIN_RPC_2: ${{ secrets.QUICKNODE_BERACHAIN_RPC_2 }}
          REWARD_CLAIM_CHAINS: berachain
          REWARD_CLAIM_CHUNK_SIZE_BERACHAIN: '10000'
          REWARD_CLAIM_TIMESTAMP_BATCH_SIZE_BERACHAIN: '20'
        run: python generate_reward_claim_events.py

      - name: Generate oDOLO flows
        timeout-minutes: 60
        env:
          PYTHONUNBUFFERED: '1'
          ALCHEMY_BERACHAIN_RPC: ${{ secrets.ALCHEMY_BERACHAIN_RPC }}
          ALCHEMY_BERACHAIN_RPC_2_JEFF: ${{ secrets.ALCHEMY_BERACHAIN_RPC_2_JEFF }}
          ALCHEMY_BERACHAIN_RPC_2: ${{ secrets.ALCHEMY_BERACHAIN_RPC_2 }}
          ALCHEMY_BERACHAIN_RPC_3: ${{ secrets.ALCHEMY_BERACHAIN_RPC_3 }}
          DRPC_BERACHAIN_RPC_ZEN: ${{ secrets.DRPC_BERACHAIN_RPC_ZEN }}
          QUICKNODE_BERACHAIN_RPC_2: ${{ secrets.QUICKNODE_BERACHAIN_RPC_2 }}
          ODOLO_FLOW_RPC_BATCH_SIZE: '50'
          ODOLO_FLOW_RPC_RETRIES_PER_ENDPOINT: '2'
        run: python generate_odolo_flows.py

      - name: Save scan progress even when generation fails
        if: ${{ always() && steps.flow_cache.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: |
            odolo_flows_state.json
            odolo_claim_events_state.json
            reward_claim_events_state.json
            odolo_flow_checkpoints
          key: ${{ steps.flow_cache.outputs.cache-primary-key }}

      - name: Validate generated data
        run: python3 validate_data.py odolo_flows.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Claims were private scan inputs; the independent publisher owns them.
          # Keep cached checkpoints, but clear tracked inputs before rebasing.
          git restore --worktree -- data/odolo-claim-events.json data/reward-claim-events.json data/reward-claim-events
          git add odolo_flows.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "🔄 Update oDOLO flows data — $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Retry push with rebase up to 3 times to handle concurrent pushes
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase -X ours origin master && git push; then pushed=true; break; fi
            echo "⚠️ Push attempt $i failed, retrying..."
            sleep 5
          done
          if [ "$pushed" != "true" ]; then echo "::error::Push failed after 3 attempts — data NOT published"; exit 1; fi

