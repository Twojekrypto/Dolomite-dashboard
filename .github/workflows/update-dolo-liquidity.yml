name: Update DOLO Liquidity

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Run a full historical replay instead of the incremental refresh'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: update-dolo-liquidity
  cancel-in-progress: false

env:
  LP_DATA_STORAGE: ${{ vars.LP_DATA_STORAGE || 'git' }}
  LP_R2_READY_DIGEST: ${{ vars.LP_R2_READY_DIGEST }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          sparse-checkout: |
            requirements.txt
            requirements-storage.txt
            scripts/data_artifact_store.py
            generate_dolo_liquidity.py
            lp_publication.py
            explorer_api.py
            rpc_client.py
            rpc_usage.py
            safe_wallets.py
            vedolo_vote_power.py
            validate_data.py
            dolo_price.json
            data/dolo-liquidity-pools.json
            data/dolo-liquidity.json
            config/lp_scanner.json
            tests/test_generate_dolo_liquidity.py
            tests/test_validate_dolo_liquidity.py
            tests/test_lp_resilience.py
            tests/fixtures/dolo-liquidity
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check LP storage mode
        run: python3 scripts/data_artifact_store.py check-mode

      - name: Install optional LP storage dependencies
        if: ${{ env.LP_DATA_STORAGE != 'git' }}
        run: pip install -r requirements-storage.txt

      - name: Restore gated LP scanner baseline
        if: ${{ env.LP_DATA_STORAGE == 'r2' }}
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: python3 scripts/data_artifact_store.py prepare --purpose resume

      - name: Test liquidity contracts
        run: python3 -m unittest tests.test_generate_dolo_liquidity tests.test_validate_dolo_liquidity tests.test_lp_resilience

      - name: Initialize LP scanner cache path
        run: echo "LP_SCANNER_CACHE_DIR=$RUNNER_TEMP/dolo-lp-scanner-cache" >> "$GITHUB_ENV"

      - name: Restore LP scanner checkpoints
        id: lp_scan_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LP_SCANNER_CACHE_DIR }}
          key: lp-scanner-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lp-scanner-v1-${{ runner.os }}-${{ github.ref_name }}-

      - name: Generate DOLO liquidity
        # Reserve 5 minutes for setup/restore and 5 for checkpoint upload within
        # the 55-minute job. A cold backfill must stop before the runner is killed.
        timeout-minutes: 45
        env:
          PYTHONUNBUFFERED: '1'
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BERASCAN_API_KEY: ${{ secrets.BERASCAN_API_KEY }}
          DRPC_ETHEREUM_RPC_2_JEFF: ${{ secrets.DRPC_ETHEREUM_RPC_2_JEFF }}
          ALCHEMY_ETHEREUM_RPC: ${{ secrets.ALCHEMY_ETHEREUM_RPC }}
          ALCHEMY_ETHEREUM_RPC_KAT: ${{ secrets.ALCHEMY_ETHEREUM_RPC_KAT }}
          ALCHEMY_ETHEREUM_RPC_DAN: ${{ secrets.ALCHEMY_ETHEREUM_RPC_DAN }}
          ALCHEMY_ETHEREUM_RPC_ZEN: ${{ secrets.ALCHEMY_ETHEREUM_RPC_ZEN }}
          ALCHEMY_ETHEREUM_RPC_2: ${{ secrets.ALCHEMY_ETHEREUM_RPC_2 }}
          ALCHEMY_ETHEREUM_RPC_3: ${{ secrets.ALCHEMY_ETHEREUM_RPC_3 }}
          ALCHEMY_BERACHAIN_RPC: ${{ secrets.ALCHEMY_BERACHAIN_RPC }}
          ALCHEMY_BERACHAIN_RPC_2_JEFF: ${{ secrets.ALCHEMY_BERACHAIN_RPC_2_JEFF }}
          ALCHEMY_BERACHAIN_RPC_2: ${{ secrets.ALCHEMY_BERACHAIN_RPC_2 }}
          ALCHEMY_BERACHAIN_RPC_3: ${{ secrets.ALCHEMY_BERACHAIN_RPC_3 }}
          QUICKNODE_BERACHAIN_RPC_2: ${{ secrets.QUICKNODE_BERACHAIN_RPC_2 }}
          DRPC_BERACHAIN_RPC_ZEN: ${{ secrets.DRPC_BERACHAIN_RPC_ZEN }}
        run: |
          full_history_arg=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.full_history }}" == "true" ]]; then
            full_history_arg="--full-history"
          fi
          python3 generate_dolo_liquidity.py --registry data/dolo-liquidity-pools.json --output data/dolo-liquidity.json $full_history_arg

      - name: Save LP scanner checkpoints even on failed refresh
        if: ${{ always() && steps.lp_scan_cache_restore.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LP_SCANNER_CACHE_DIR }}
          key: ${{ steps.lp_scan_cache_restore.outputs.cache-primary-key }}

      - name: Validate generated artifact
        run: python3 validate_data.py data/dolo-liquidity.json

      - name: Publish and verify optional LP storage
        if: ${{ env.LP_DATA_STORAGE != 'git' }}
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: python3 scripts/data_artifact_store.py publish

      - name: Stage LP publication files
        run: |
          if [ "$LP_DATA_STORAGE" = "r2" ]; then
            git add data/dolo-liquidity-pools.json
            # Hydration dirties the retained Git baseline. Clean only this copy
            # after upload so registry commits can still pull --rebase safely.
            if git ls-files --error-unmatch data/dolo-liquidity.json >/dev/null 2>&1; then
              git restore --source=HEAD --worktree -- data/dolo-liquidity.json
            fi
          else
            git add data/dolo-liquidity.json data/dolo-liquidity-pools.json
          fi

      - name: Commit and push validated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No liquidity changes to commit"
            exit 0
          fi
          git commit -m "📊 Auto-update DOLO liquidity $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin master && git push origin HEAD:master; then pushed=true; break; fi
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          if [ "$pushed" != "true" ]; then echo "::error::Push failed after 3 attempts"; exit 1; fi

      # Scheduled flows already run 30 minutes after scheduled liquidity. A
      # manual liquidity repair needs an explicit downstream refresh because
      # workflow bot pushes do not start other workflows automatically.
      - name: Refresh DOLO flow LP attribution
        if: ${{ success() && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-dolo-flows.yml --ref master -f skip_holders=true
